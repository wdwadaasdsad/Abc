<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  /* ===== 太空静谧配色（非纯黑） ===== */
  --void:#05070f;
  --bg-a:#0b1026;
  --bg-b:#0a0e20;
  --panel:rgba(146,168,224,0.045);
  --panel-2:rgba(146,168,224,0.075);
  --panel-hover:rgba(146,168,224,0.11);
  --line:rgba(150,172,230,0.12);
  --line-strong:rgba(150,172,230,0.24);
  --text-0:#eef2ff;
  --text-1:#aeb9da;
  --text-2:#6f7aa0;
  --aurora:#5eead4;        /* 极光青 */
  --aurora-d:#38bdf8;      /* 星河蓝 */
  --nebula:#a78bfa;        /* 星云紫 */
  --nebula-l:#c4b5fd;
  --star:#f6d9a8;          /* 暖星金 */
  --grad-aurora:linear-gradient(135deg,#5eead4 0%,#7aa2f7 45%,#a78bfa 100%);
  --grad-text:linear-gradient(115deg,#7ddfe6 0%,#a78bfa 55%,#f6d9a8 110%);
  --ease-x:cubic-bezier(0.16,1,0.3,1);
  --ease-q:cubic-bezier(0.22,1,0.36,1);
  --radius:16px;
  --maxw:1320px;
  /* 分类强调色（统一于宇宙色系） */
  --c-app:#5eead4; --c-web:#a78bfa; --c-system:#7aa2f7; --c-ecom:#58e0b8; --c-brand:#f6c98a; --c-morong:#8b9dff;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;font-size:16px;}

/* 星空画布：固定最底层 */
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none;display:block;}

body{
  font-family:"Noto Sans SC","Space Grotesk",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text-1);
  line-height:1.65;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(130% 90% at 50% -15%, #15214c 0%, rgba(21,33,76,0) 55%),
    linear-gradient(180deg, #0a0e20 0%, #0b1026 45%, #070a18 100%);
  background-attachment:fixed;
}

/* 星云光晕：缓慢漂移 */
body::before{
  content:'';position:fixed;inset:-20%;
  background:
    radial-gradient(40% 35% at 18% 22%, rgba(94,234,212,0.10), transparent 70%),
    radial-gradient(45% 40% at 82% 78%, rgba(167,139,250,0.13), transparent 70%),
    radial-gradient(30% 30% at 60% 12%, rgba(122,162,247,0.08), transparent 70%);
  filter:blur(20px);
  z-index:0;pointer-events:none;
  animation:nebulaDrift 28s ease-in-out infinite alternate;
}
@keyframes nebulaDrift{0%{transform:translate3d(0,0,0) scale(1);}100%{transform:translate3d(2%,-2%,0) scale(1.08);}}

/* 近景星云团（保留原 glow-orb，重定义为太空光晕） */
.glow-orb{position:fixed;border-radius:50%;filter:blur(110px);opacity:0.18;pointer-events:none;z-index:0;mix-blend-mode:screen;}
.glow-orb-1{width:520px;height:520px;background:radial-gradient(circle,#5eead4,transparent 70%);top:-160px;left:-120px;animation:float1 22s ease-in-out infinite alternate;}
.glow-orb-2{width:480px;height:480px;background:radial-gradient(circle,#a78bfa,transparent 70%);bottom:-140px;right:-120px;animation:float2 27s ease-in-out infinite alternate;}
@keyframes float1{to{transform:translate(40px,30px);}}
@keyframes float2{to{transform:translate(-40px,-30px);}}

/* ===== 导航 ===== */
.nav{position:sticky;top:0;z-index:100;background:rgba(8,11,22,0.55);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--line);}
.nav-inner{max-width:var(--maxw);margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{font-family:"Space Grotesk",sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:2px;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
.nav-links{display:flex;gap:4px;list-style:none;}
.nav-links a{color:var(--text-2);text-decoration:none;padding:7px 15px;border-radius:10px;font-size:0.85rem;letter-spacing:.5px;transition:all .3s var(--ease-x);}
.nav-links a:hover,.nav-links a.active{color:var(--text-0);background:var(--panel-2);}
:focus-visible{outline:2px solid var(--aurora);outline-offset:2px;border-radius:6px;}
.nav-toggle{display:none;align-items:center;justify-content:center;width:40px;height:40px;margin-left:8px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text-1);cursor:pointer;transition:all .25s var(--ease-x);}
.nav-toggle:hover{border-color:rgba(94,234,212,0.4);color:var(--text-0);}

/* ===== 英雄区 ===== */
.hero{position:relative;z-index:1;text-align:center;padding:clamp(70px,12vh,120px) 24px 64px;}
.hero-badge{display:inline-block;padding:6px 18px;border:1px solid rgba(94,234,212,0.35);border-radius:30px;font-size:0.72rem;letter-spacing:3px;color:var(--aurora);background:rgba(94,234,212,0.06);margin-bottom:26px;backdrop-filter:blur(6px);animation:fadeUp .8s var(--ease-x) both;}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);font-weight:700;color:var(--text-0);letter-spacing:-1px;margin-bottom:14px;line-height:1.1;animation:fadeUp .8s var(--ease-x) .08s both;}
.hero h1 span{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
.hero-subtitle{font-size:clamp(0.95rem,1.6vw,1.12rem);color:var(--text-2);max-width:580px;margin:0 auto 34px;line-height:1.85;animation:fadeUp .8s var(--ease-x) .16s both;}
.hero-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;animation:fadeUp .8s var(--ease-x) .24s both;}
.hero-tag{padding:7px 18px;border-radius:30px;font-size:0.8rem;color:var(--text-1);background:var(--panel);border:1px solid var(--line);transition:all .35s var(--ease-x);}
.hero-tag:hover{border-color:rgba(94,234,212,0.4);color:var(--text-0);background:var(--panel-2);transform:translateY(-2px);}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}

/* ===== 筛选栏 ===== */
.filter-bar{position:relative;z-index:1;display:flex;justify-content:center;flex-wrap:wrap;gap:9px;padding:0 24px 38px;}
.filter-btn{padding:9px 20px;border-radius:30px;border:1px solid var(--line);background:var(--panel);color:var(--text-2);font-size:0.83rem;cursor:pointer;transition:all .35s var(--ease-x);font-family:inherit;min-height:44px;white-space:nowrap;letter-spacing:.5px;}
.filter-btn:hover{border-color:rgba(94,234,212,0.4);color:var(--text-0);}
.filter-btn.active{color:#04121a;background:var(--grad-aurora);border-color:transparent;font-weight:600;box-shadow:0 6px 22px rgba(94,234,212,0.25);}

/* ===== 作品网格 ===== */
.portfolio{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 24px 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;}
.card{position:relative;background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .5s var(--ease-x),border-color .5s,box-shadow .5s;backdrop-filter:blur(8px);}
.card::before{content:'';position:absolute;inset:0;border-radius:var(--radius);padding:1px;background:linear-gradient(160deg,rgba(94,234,212,0.55),rgba(167,139,250,0.25),transparent 62%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .5s var(--ease-x);pointer-events:none;z-index:3;}
.card:hover{transform:translateY(-8px);border-color:var(--line-strong);box-shadow:0 18px 50px rgba(5,8,20,0.6),0 8px 40px rgba(122,162,247,0.12);}
.card:hover::before{opacity:1;}
.card-img-wrap{position:relative;overflow:hidden;background:rgba(4,6,14,0.35);aspect-ratio:1/1;}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform .7s var(--ease-x);}
.card:hover .card-img-wrap img{transform:scale(1.07);}
.card-img-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(8,11,22,0.6),transparent 35%);pointer-events:none;}
.card-cat-tag{position:absolute;top:12px;right:12px;padding:5px 13px;border-radius:14px;font-size:0.7rem;font-weight:600;letter-spacing:.5px;z-index:2;backdrop-filter:blur(8px);background:rgba(8,11,22,0.5);border:1px solid var(--line);}
.card-img-count{position:absolute;bottom:12px;left:12px;padding:4px 11px;border-radius:11px;font-size:0.7rem;color:var(--text-1);background:rgba(5,8,18,0.6);backdrop-filter:blur(6px);z-index:2;border:1px solid var(--line);}
.cat-app{color:var(--c-app);} .cat-web{color:var(--c-web);} .cat-system{color:var(--c-system);} .cat-ecom{color:var(--c-ecom);} .cat-brand{color:var(--c-brand);} .cat-morong{color:var(--c-morong);}
.card-body{padding:20px;}
.card-title{font-size:1.02rem;font-weight:700;color:var(--text-0);margin-bottom:6px;letter-spacing:.3px;}
.card-role{font-size:0.76rem;color:var(--text-2);margin-bottom:10px;letter-spacing:.5px;}
.card-desc{font-size:0.82rem;color:var(--text-1);line-height:1.55;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-tools{display:flex;flex-wrap:wrap;gap:6px;}
.card-tool{padding:4px 11px;border-radius:8px;font-size:0.7rem;background:var(--panel);color:var(--text-2);border:1px solid var(--line);}
.card-expand{display:inline-flex;align-items:center;gap:5px;margin-top:14px;font-size:0.78rem;color:var(--aurora);font-weight:600;transition:gap .35s var(--ease-x);}
.card:hover .card-expand{gap:9px;}
.card-expand svg{width:14px;height:14px;}
.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-2);}

/* ===== 灯箱 ===== */
.lightbox{position:fixed;inset:0;z-index:1000;background:rgba(4,6,14,0.86);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .35s var(--ease-x);}
.lightbox.open{opacity:1;visibility:visible;}
.lb-container{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:92vw;max-height:92vh;}
.lb-main{position:relative;display:flex;align-items:center;justify-content:center;}
.lb-main img{max-width:85vw;max-height:55vh;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,0.6);object-fit:contain;background:#0b0e1c;}
.lb-counter{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:0.8rem;color:var(--text-1);font-weight:600;letter-spacing:1px;background:rgba(5,8,18,0.6);border:1px solid var(--line);padding:4px 14px;border-radius:12px;white-space:nowrap;}
.lb-close{position:absolute;top:16px;right:20px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text-1);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s var(--ease-x);z-index:10;}
.lb-close:hover{background:var(--panel-2);border-color:rgba(94,234,212,0.4);color:var(--text-0);}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text-1);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s var(--ease-x);}
.lb-nav:hover{background:var(--panel-2);border-color:rgba(94,234,212,0.4);color:var(--text-0);}
.lb-prev{left:-56px;} .lb-next{right:-56px;}
.lb-info{text-align:center;max-width:500px;}
.lb-info h3{font-size:1.1rem;color:var(--text-0);margin-bottom:4px;}
.lb-info .lb-role{font-size:0.78rem;color:var(--text-2);}
.lb-thumbs{display:flex;gap:8px;overflow-x:auto;max-width:85vw;padding:4px 0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.1) transparent;}
.lb-thumbs::-webkit-scrollbar{height:4px;}
.lb-thumbs::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px;}
.lb-thumb{flex-shrink:0;width:68px;height:68px;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all .25s var(--ease-x);opacity:0.5;background:rgba(4,6,14,0.3);}
.lb-thumb:hover{opacity:0.85;border-color:rgba(150,172,230,0.3);}
.lb-thumb.active{opacity:1;border-color:var(--aurora);}
.lb-thumb img{width:100%;height:100%;object-fit:cover;}

/* ===== 页脚 ===== */
.footer{position:relative;z-index:1;text-align:center;padding:44px 24px;border-top:1px solid var(--line);color:var(--text-2);font-size:0.8rem;letter-spacing:.5px;}

/* ===== 产品页（亚马逊式 / 平铺式） ===== */
.product-page{display:none;position:relative;z-index:2;min-height:calc(100vh - 60px);}
.product-page.open{display:block;}
.pp-inner{max-width:1180px;margin:0 auto;padding:30px 24px 90px;}
.pp-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text-1);font-size:0.84rem;cursor:pointer;transition:all .3s var(--ease-x);}
.pp-back:hover{border-color:rgba(94,234,212,0.4);color:var(--text-0);background:var(--panel-2);}
.pp-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,0.9fr);gap:36px;align-items:start;}
.pp-gallery{display:grid;grid-template-columns:72px 1fr;gap:14px;position:sticky;top:84px;}
.pp-thumbs{display:flex;flex-direction:column;gap:10px;}
.pp-thumb{width:68px;height:68px;border-radius:10px;overflow:hidden;border:2px solid transparent;background:rgba(4,6,14,0.3);cursor:pointer;transition:all .2s var(--ease-x);}
.pp-thumb:hover{border-color:rgba(94,234,212,0.5);}
.pp-thumb.active{border-color:var(--aurora);}
.pp-thumb img{width:100%;height:100%;object-fit:cover;}
.pp-main{aspect-ratio:1/1;background:#fff;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.pp-main img{width:100%;height:100%;object-fit:contain;}
.pp-info{display:flex;flex-direction:column;gap:22px;}
.pp-title{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:700;color:var(--text-0);line-height:1.25;letter-spacing:-.3px;}
.pp-meta{font-size:0.82rem;color:var(--text-2);letter-spacing:.5px;}
.pp-intro{font-size:0.92rem;color:var(--text-1);line-height:1.9;}
.pp-colors-label{font-size:0.74rem;color:var(--text-2);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}
.pp-colors{display:flex;flex-wrap:wrap;gap:10px;}
.pp-color{display:flex;flex-direction:column;align-items:center;gap:6px;padding:7px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;transition:all .3s var(--ease-x);min-width:64px;}
.pp-color:hover{border-color:rgba(94,234,212,0.5);}
.pp-color.active{border-color:var(--aurora);background:rgba(94,234,212,0.08);box-shadow:0 0 0 1px rgba(94,234,212,0.3);}
.pp-color img{width:48px;height:48px;object-fit:cover;border-radius:8px;}
.pp-color span{font-size:0.72rem;color:var(--text-1);}
.pp-color.active span{color:var(--text-0);}
.pp-aplus{margin-top:30px;}
.pp-aplus h4{font-size:0.74rem;color:var(--text-2);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;}
.pp-aplus-grid{display:grid;grid-template-columns:1fr;gap:16px;}
.pp-aplus img{width:100%;border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,0.45);}
.pp-empty{color:var(--text-2);font-size:0.85rem;}
.pp-main-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.pp-main-grid img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:14px;padding:8px;}

/* 平铺式（无 A+）：居中、简介居中、按组排列 */
.pp-flat{max-width:1120px;margin:0 auto;padding:12px 16px 64px;text-align:center;}
.pp-flat-head{text-align:center;margin-bottom:6px;}
.pp-intro-center{max-width:760px;margin:16px auto 30px;}
.pp-intro-center p{text-align:center;color:var(--text-1);line-height:1.9;}
.pp-group-label{margin:36px 0 16px;font-size:1.12rem;font-weight:600;color:var(--text-0);letter-spacing:.5px;}
.pp-group-label::before,.pp-group-label::after{content:"";display:inline-block;width:32px;height:1px;background:linear-gradient(90deg,transparent,var(--aurora));vertical-align:middle;margin:0 12px;}
.pp-group-label::after{background:linear-gradient(90deg,var(--aurora),transparent);}
.pp-flat-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;}
.pp-flat-grid img{width:200px;max-width:30vw;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:14px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,0.4);transition:transform .25s var(--ease-x),box-shadow .25s;}
.pp-flat-grid img:hover{transform:translateY(-5px);box-shadow:0 12px 36px rgba(122,162,247,0.25);}

/* ===== 响应式 ===== */
@media (max-width:1024px){
  .portfolio{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
  .lb-prev{left:-40px;} .lb-next{right:-40px;}
  .pp-layout{grid-template-columns:1fr;gap:28px;}
  .pp-gallery{position:static;grid-template-columns:1fr;}
  .pp-thumbs{flex-direction:row;order:2;overflow-x:auto;padding-bottom:4px;}
}
@media (max-width:768px){
  .nav-toggle{display:flex;}
  .nav-links{display:none;position:absolute;top:60px;right:16px;flex-direction:column;gap:2px;background:rgba(8,11,22,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:140px;box-shadow:0 12px 36px rgba(0,0,0,0.5);}
  .nav-links.open{display:flex;}
  .nav-links a{display:block;text-align:center;}
  .hero{padding:56px 20px 44px;}
  .hero h1{font-size:clamp(1.7rem,6vw,2.2rem);}
  .hero-subtitle{font-size:0.92rem;}
  .portfolio{grid-template-columns:1fr;gap:18px;padding:0 16px 56px;}
  .filter-bar{padding:0 12px 28px;gap:6px;}
  .filter-btn{padding:7px 14px;font-size:0.78rem;}
  .lb-main img{max-width:92vw;max-height:45vh;}
  .lb-nav{width:40px;height:40px;}
  .lb-prev{left:4px;} .lb-next{right:4px;}
  .lb-thumb{width:52px;height:52px;}
  .lb-thumbs{max-width:92vw;}
  .pp-inner{padding:16px 16px 56px;}
  .pp-gallery{gap:10px;}
  .pp-main-grid{grid-template-columns:1fr;}
  .pp-flat-grid img{width:44vw;max-width:none;}
}

/* ===== 滚动揭示 ===== */
.js-reveal .card{opacity:0;transform:translateY(28px);transition:opacity .7s var(--ease-x),transform .7s var(--ease-x);}
.js-reveal .card.in{opacity:1;transform:none;}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
  .js-reveal .card{opacity:1!important;transform:none!important;}
}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="glow-orb glow-orb-1"></div>
<div class="glow-orb glow-orb-2"></div>
<nav class="nav"><div class="nav-inner"><div class="nav-logo">PORTFOLIO</div><ul class="nav-links" id="navLinks"><li><a href="#hero" class="active">首页</a></li><li><a href="#works">作品</a></li></ul><button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false" aria-controls="navLinks"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button></div></nav>

<section class="hero" id="hero">

function getTotalImages(p) {
  if (p.images) return p.images.length;
  if (p.groups) return p.groups.reduce((s,g)=>s+(g.images||[]).length, 0);
  if (p.colors) {
    const mainCount = p.colors.reduce((s,c)=>s+(c.main||[]).length,0);
    const aplusCount = p.colors.reduce((s,c)=>s+(c.aplus||[]).length,0);
    return mainCount + aplusCount;
  }
  return 1 + (p.details ? p.details.length : 0);
}

function renderCards(filter) {
  const filtered = filter==='all' ? projects : projects.filter(p=>p.category===filter);
  grid.innerHTML = '';
  if (filtered.length===0) { emptyState.style.display='block'; return; }
  emptyState.style.display = 'none';
  filtered.forEach(p => {
    const total = getTotalImages(p);
    const card = document.createElement('figure');
    card.className = 'card';
    card.innerHTML = `<div class="card-img-wrap"><img src="${p.cover || p.img}" alt="${p.name}" loading="lazy"><span class="card-cat-tag ${catClassMap[p.category]||''}">${p.catName}</span><span class="card-img-count">${total} 张</span></div><figcaption class="card-body"><div class="card-title">${p.name}</div><div class="card-role">${p.role}</div><div class="card-desc">${p.desc}</div><div class="card-tools">${p.tools.map(t=>`<span class="card-tool">${t}</span>`).join('')}</div><div class="card-expand">查看全部 ${total} 张<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><line x1="12" y1="5" x2="12" y2="19"/></svg></div></figcaption>`;
    card.addEventListener('click', () => {
      if (p.category==='ecom') {
        location.hash = `#/product/${p.id}`;
      } else {
        lastTrigger = card;
        openLightbox(p);
      }
    });
    grid.appendChild(card);
  });
}

// ===== Product page =====
let currentProduct = null;
let activeColorIdx = 0;
let activeMainIdx = 0;

function openProductPage(id) {
  const p = projects.find(x=>x.id===id);
  if (!p) return;
  currentProduct = p;
  activeColorIdx = 0;
  activeMainIdx = 0;
  renderProductPage();
  hero.style.display='none';
  filterBar.style.display='none';
  grid.style.display='none';
  footer.style.display='none';
  emptyState.style.display='none';
  productPage.classList.add('open');
  window.scrollTo(0,0);
}

function closeProductPage() {
  location.hash = '';
}

function renderProductPage() {
  const p = currentProduct;
  const hasAplus = p.colors && p.colors.some(c => c.aplus && c.aplus.length);

  // 无 A+：居中排版，简介居中，按颜色/形状分组，每组 4-5 张一排
  if (!hasAplus) {
    const groups = p.groups || [{name:'', images: p.images || (p.colors||[]).reduce((arr,c)=>arr.concat(c.main||[]), [])}];
    const groupsHtml = groups.map(g=>{
      const label = g.name ? `<div class="pp-group-label">${g.name}</div>` : '';
      const imgs = g.images.map((im,i)=>`<img src="${im}" alt="${p.name}${g.name?(' '+g.name):''} 第${i+1}张" loading="lazy">`).join('');
      return `${label}<div class="pp-flat-grid">${imgs}</div>`;
    }).join('');
    productInner.innerHTML = `
      <button class="pp-back" id="ppBack" aria-label="返回作品集">← 返回作品集</button>
      <div class="pp-flat">
        <div class="pp-flat-head">
          <h1 class="pp-title">${p.name}</h1>
          <div class="pp-meta">${p.catName} · ${p.role||'独立设计'}</div>
        </div>
        <div class="pp-intro pp-intro-center"><p>${p.intro||''}</p></div>
        <div class="pp-flat-body">${groupsHtml}</div>
      </div>`;
    const backBtn = document.getElementById('ppBack');
    if (backBtn) backBtn.addEventListener('click', closeProductPage);
    return;
  }

  // 有 A+：亚马逊式，颜色切换 + A+ 配对
  const colors = p.colors || [];
  const activeColor = colors[activeColorIdx] || colors[0] || {name:'',main:[],aplus:[]};
  const mainImgs = activeColor.main || [];
  const mainImg = mainImgs[activeMainIdx] || mainImgs[0] || p.img;

  const thumbsHtml = mainImgs.map((img,i)=>`
    <button class="pp-thumb${i===activeMainIdx?' active':''}" data-idx="${i}" aria-label="查看第${i+1}张主图">
      <img src="${img}" alt="">
    </button>`).join('');

  const colorsHtml = colors.map((c,i)=>`
    <button class="pp-color${i===activeColorIdx?' active':''}" data-idx="${i}" aria-label="切换到 ${c.name}">
      <img src="${c.main[0]||p.img}" alt="${c.name}">
      <span>${c.name}</span>
    </button>`).join('');

  const aplusHtml = (activeColor.aplus && activeColor.aplus.length) ? `
    <div class="pp-aplus">
      <h4>A+ 内容</h4>
      <div class="pp-aplus-grid">${activeColor.aplus.map(im=>`<img src="${im}" alt="" loading="lazy">`).join('')}</div>
    </div>` : '';

  productInner.innerHTML = `
    <button class="pp-back" id="ppBack" aria-label="返回作品集">← 返回作品集</button>
    <div class="pp-layout">
      <div class="pp-gallery">
        <div class="pp-thumbs" id="ppThumbs">${thumbsHtml}</div>
        <div class="pp-main"><img id="ppMain" src="${mainImg}" alt="${p.name}"></div>
      </div>
      <div class="pp-info">
        <div>
          <h1 class="pp-title">${p.name}</h1>
          <div class="pp-meta">${p.catName} · ${p.role||'独立设计'}</div>
        </div>
        <div class="pp-intro"><p>${p.intro||''}</p></div>
        ${colors.length>1?`<div><div class="pp-colors-label">选择颜色 / 款式</div><div class="pp-colors" id="ppColors">${colorsHtml}</div></div>`:`<div class="pp-colors-label">${colors[0]?colors[0].name:'默认款'}</div>`}
        ${aplusHtml}
      </div>
    </div>`;

  const backBtn = document.getElementById('ppBack');
  if (backBtn) backBtn.addEventListener('click', closeProductPage);

  const thumbs = document.getElementById('ppThumbs');
  if (thumbs) thumbs.querySelectorAll('.pp-thumb').forEach(btn=>{
    btn.addEventListener('click',()=>{
      activeMainIdx = parseInt(btn.dataset.idx);
      renderProductPage();
    });
  });

  const colorBtns = document.getElementById('ppColors');
  if (colorBtns) colorBtns.querySelectorAll('.pp-color').forEach(btn=>{
    btn.addEventListener('click',()=>{
      activeColorIdx = parseInt(btn.dataset.idx);
      activeMainIdx = 0;
      renderProductPage();
    });
  });
}

function handleRoute() {
  const m = location.hash.match(/^#\/product\/(\d+)$/);
  if (m) {
    openProductPage(parseInt(m[1]));
  } else {
    productPage.classList.remove('open');
    productInner.innerHTML = '';
    hero.style.display='';
    filterBar.style.display='';
    grid.style.display='';
    footer.style.display='';
    const activeBtn = document.querySelector('.filter-btn.active');
    if (activeBtn) renderCards(activeBtn.dataset.filter);
    window.scrollTo(0,0);
  }
}

let currentLbProject = null, currentImgIdx = 0, flatImages = [], lastTrigger = null;

function openLightbox(project) {
  currentLbProject = project;
  flatImages = [project.img, ...(project.details||[])];
  currentImgIdx = 0;
  renderLightbox();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
  lightbox.setAttribute('tabindex','-1');
  lightbox.focus();
  updateNavVisibility();
}

function renderLightbox() {
  const p = currentLbProject;
  const total = flatImages.length;
  const curImg = flatImages[currentImgIdx];
  lbContainer.innerHTML = `
    <div class="lb-main">
      <span class="lb-counter">${currentImgIdx+1} / ${total}</span>
      <img src="${curImg}" alt="${p.name}">
    </div>
    <div class="lb-info"><h3>${p.name}</h3><div class="lb-role">${p.role} · ${p.tools.join(' / ')}</div></div>
    <div class="lb-thumbs">${flatImages.map((img,i)=>`<div class="lb-thumb${i===currentImgIdx?' active':''}" data-idx="${i}"><img src="${img}" alt="" loading="lazy"></div>`).join('')}</div>
  `;
  lbContainer.querySelectorAll('.lb-thumb').forEach(thumb => {
    thumb.addEventListener('click', (e) => {
      e.stopPropagation();
      currentImgIdx = parseInt(thumb.dataset.idx);
      renderLightbox();
      updateNavVisibility();
    });
  });
  const activeThumb = lbContainer.querySelector('.lb-thumb.active');
  if (activeThumb) activeThumb.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
}

function updateNavVisibility() {
  lbPrev.style.display = flatImages.length>1?'flex':'none';
  lbNext.style.display = flatImages.length>1?'flex':'none';
}

function prevImg() { if (flatImages.length>1) { currentImgIdx=(currentImgIdx-1+flatImages.length)%flatImages.length; renderLightbox(); } }
function nextImg() { if (flatImages.length>1) { currentImgIdx=(currentImgIdx+1)%flatImages.length; renderLightbox(); } }

lbClose.addEventListener('click', closeLightbox);
lbPrev.addEventListener('click', (e) => { e.stopPropagation(); prevImg(); });
lbNext.addEventListener('click', (e) => { e.stopPropagation(); nextImg(); });
lightbox.addEventListener('click', (e) => { if (e.target===lightbox) closeLightbox(); });
function closeLightbox() { lightbox.classList.remove('open'); document.body.style.overflow=''; currentLbProject=null; flatImages=[]; if(lastTrigger){ lastTrigger.focus(); lastTrigger=null; } }

document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key==='Escape') closeLightbox();
  if (e.key==='ArrowLeft') prevImg();
  if (e.key==='ArrowRight') nextImg();
});

// ===== Filter / nav =====
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderCards(btn.dataset.filter);
  });
});

document.querySelectorAll('.nav-links a').forEach(link => {
  link.addEventListener('click', (e) => {
    e.preventDefault();
    const t = document.querySelector(link.getAttribute('href'));
    if(t) t.scrollIntoView({behavior:'smooth'});
    document.querySelectorAll('.nav-links a').forEach(l=>l.classList.remove('active'));
    link.classList.add('active');
  });
});

const navToggle = document.getElementById('navToggle');
const navLinks = document.getElementById('navLinks');
navToggle.addEventListener('click', () => {
  const open = navLinks.classList.toggle('open');
  navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  navToggle.setAttribute('aria-label', open ? '关闭菜单' : '打开菜单');
});
navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
  navLinks.classList.remove('open');
  navToggle.setAttribute('aria-expanded','false');
  navToggle.setAttribute('aria-label','打开菜单');
}));

window.addEventListener('hashchange', handleRoute);
renderCards('all');
handleRoute();
</script>
<script>

(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ===== 星空 canvas ===== */
  var canvas = document.getElementById('starfield');
  var ctx = canvas.getContext('2d');
  var w, h, dpr, stars = [];
  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    w = canvas.width = Math.floor(innerWidth*dpr);
    h = canvas.height = Math.floor(innerHeight*dpr);
    canvas.style.width = innerWidth+'px';
    canvas.style.height = innerHeight+'px';
    var count = Math.min(220, Math.floor(innerWidth*innerHeight/9000));
    stars = [];
    for(var i=0;i<count;i++){
      var rnd = Math.random();
      var hue = rnd<0.16 ? 'aurora' : (rnd<0.30 ? 'violet' : 'white');
      stars.push({x:Math.random()*w, y:Math.random()*h, r:(Math.random()*1.3+0.3)*dpr,
        a:Math.random()*0.6+0.2, tw:Math.random()*0.02+0.005, phase:Math.random()*6.28,
        drift:(Math.random()*0.12+0.02)*dpr, hue:hue});
    }
  }
  function colorFor(t,a){
    if(t==='aurora') return 'rgba(94,234,212,'+a+')';
    if(t==='violet') return 'rgba(167,139,250,'+a+')';
    return 'rgba(230,238,255,'+a+')';
  }
  var shooting=null;
  function spawnShoot(){
    if(reduce) return;
    shooting={x:Math.random()*w*0.6, y:Math.random()*h*0.4, len:Math.random()*160+120, life:0};
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){
      var s=stars[i]; s.phase+=s.tw;
      var a=s.a*(0.6+0.4*Math.sin(s.phase));
      ctx.beginPath(); ctx.fillStyle=colorFor(s.hue,a);
      ctx.arc(s.x,s.y,s.r,0,6.2832); ctx.fill();
      s.y+=s.drift; if(s.y>h){s.y=0; s.x=Math.random()*w;}
    }
    if(shooting){
      shooting.life+=0.02; var p=shooting.life;
      var x2=shooting.x+p*shooting.len, y2=shooting.y+p*shooting.len*0.6;
      var g=ctx.createLinearGradient(shooting.x,shooting.y,x2,y2);
      g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(180,230,255,'+(0.5*(1-p))+')');
      ctx.strokeStyle=g; ctx.lineWidth=1.5*dpr; ctx.beginPath();
      ctx.moveTo(shooting.x,shooting.y); ctx.lineTo(x2,y2); ctx.stroke();
      if(p>=1) shooting=null;
    }
    requestAnimationFrame(draw);
  }
  resize(); draw();
  if(!reduce){
    setInterval(function(){ if(!shooting && Math.random()<0.5) spawnShoot(); }, 4000);
    addEventListener('resize', resize);
    var tx=0,ty=0,cx=0,cy=0;
    addEventListener('mousemove', function(e){ tx=(e.clientX/innerWidth-0.5); ty=(e.clientY/innerHeight-0.5); });
    (function par(){ cx+=(tx-cx)*0.04; cy+=(ty-cy)*0.04;
      canvas.style.transform='translate('+(-cx*12)+'px,'+(-cy*12)+'px)'; requestAnimationFrame(par); })();
  }

  /* ===== 滚动揭示 ===== */
  document.body.classList.add('js-reveal');
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  }, {threshold:0.12, rootMargin:'0px 0px -8% 0px'});
  function observeCards(){
    var cards=document.querySelectorAll('.portfolio .card:not(.in)');
    for(var i=0;i<cards.length;i++){
      cards[i].style.transitionDelay=(Math.min(i,8)*0.06)+'s';
      io.observe(cards[i]);
    }
  }
  observeCards();
  var works=document.getElementById('works');
  if(works && 'MutationObserver' in window){
    new MutationObserver(function(){ observeCards(); }).observe(works,{childList:true});
  }
})();

</script>
